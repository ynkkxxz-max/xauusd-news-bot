<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Wizdumb Co., Ltd — Professional Client Service Enquiry Form">
  <title>Wizdumb Co., Ltd — Service Enquiry Form</title>
  
  <!-- Modern Typography (Inter & Outfit) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-light: #eef2ff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --border-focus: #6366f1;
      --card-bg: #ffffff;
      --body-bg: #0f172a;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 20px;
      --shadow-premium: 0 20px 40px -15px rgba(0, 0, 0, 0.25), 0 0 0 1px rgba(255, 255, 255, 0.1);
      --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #090d16 0%, #111827 50%, #1e1b4b 100%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      line-height: 1.5;
    }

    .form-wrapper {
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-premium);
      width: 100%;
      max-width: 520px;
      overflow: hidden;
      position: relative;
    }

    .form-header {
      background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
      color: #ffffff;
      padding: 32px 36px 28px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(99, 102, 241, 0.25);
      border: 1px solid rgba(165, 180, 252, 0.3);
      color: #c7d2fe;
      padding: 4px 12px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .form-header h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
      color: #ffffff;
    }

    .form-header p {
      font-size: 14px;
      color: #cbd5e1;
    }

    form {
      padding: 36px;
    }

    .form-group {
      margin-bottom: 22px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: #1e293b;
      margin-bottom: 8px;
    }

    .required-star {
      color: #ef4444;
      margin-left: 2px;
    }

    .input-wrapper {
      position: relative;
    }

    input[type="text"],
    input[type="email"],
    input[type="date"] {
      width: 100%;
      padding: 12px 16px;
      font-family: inherit;
      font-size: 15px;
      color: var(--text-main);
      background-color: #f8fafc;
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius-sm);
      transition: var(--transition);
      outline: none;
    }

    input[type="text"]:focus,
    input[type="email"]:focus,
    input[type="date"]:focus {
      background-color: #ffffff;
      border-color: var(--border-focus);
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
    }

    input::placeholder {
      color: #94a3b8;
    }

    /* Instruction 5: Fieldset & Legend */
    fieldset {
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 20px;
      margin-bottom: 28px;
      background: #fafafa;
    }

    legend {
      font-size: 14px;
      font-weight: 600;
      color: #1e293b;
      padding: 0 8px;
    }

    .radio-grid {
      display: grid;
      gap: 10px;
      margin-top: 6px;
    }

    /* Accessible Custom Radio Cards */
    .radio-card {
      display: flex;
      align-items: center;
      background: #ffffff;
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 12px 16px;
      cursor: pointer;
      transition: var(--transition);
      position: relative;
    }

    .radio-card:hover {
      border-color: #cbd5e1;
      background: #f8fafc;
    }

    /* Native radio input preserved for keyboard accessibility */
    .radio-card input[type="radio"] {
      appearance: none;
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border: 2px solid #cbd5e1;
      border-radius: 50%;
      margin-right: 12px;
      outline: none;
      transition: var(--transition);
      cursor: pointer;
      display: grid;
      place-content: center;
      flex-shrink: 0;
    }

    .radio-card input[type="radio"]::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      transform: scale(0);
      transition: 0.15s transform ease-in-out;
      background-color: #ffffff;
    }

    .radio-card input[type="radio"]:checked {
      background-color: var(--primary);
      border-color: var(--primary);
    }

    .radio-card input[type="radio"]:checked::before {
      transform: scale(1);
    }

    /* Keyboard focus state (WCAG AA Compliance) */
    .radio-card input[type="radio"]:focus-visible {
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.25);
    }

    .radio-card:has(input[type="radio"]:checked) {
      border-color: var(--primary);
      background-color: var(--primary-light);
    }

    .radio-card label {
      margin-bottom: 0;
      cursor: pointer;
      font-weight: 500;
      color: #334155;
      width: 100%;
    }

    .radio-card:has(input[type="radio"]:checked) label {
      color: var(--primary);
      font-weight: 600;
    }

    /* Instruction 7: Submit button */
    button[type="submit"] {
      width: 100%;
      padding: 14px 24px;
      font-family: inherit;
      font-size: 16px;
      font-weight: 600;
      color: #ffffff;
      background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%);
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(79, 70, 229, 0.4);
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    button[type="submit"]:hover {
      background: linear-gradient(135deg, #4338ca 0%, #3730a3 100%);
      box-shadow: 0 6px 20px rgba(79, 70, 229, 0.5);
      transform: translateY(-1px);
    }

    button[type="submit"]:active {
      transform: translateY(1px);
      box-shadow: 0 2px 8px rgba(79, 70, 229, 0.4);
    }

    /* Focus visible ring for 15-second keyboard test */
    button[type="submit"]:focus-visible {
      outline: 3px solid #818cf8;
      outline-offset: 3px;
    }

    .form-footer {
      text-align: center;
      font-size: 12px;
      color: #94a3b8;
      margin-top: 18px;
    }
  </style>
</head>
<body>

  <div class="form-wrapper">
    <!-- Visual Brand Header -->
    <header class="form-header">
      <span class="brand-badge">Wizdumb Co., Ltd</span>
      <h1>Service Enquiry Form</h1>
      <p>Tell us about your project requirements and expected timeframe.</p>
    </header>

    <!-- INSTRUCTION 1: Form with action="/enquiry" and method="post" -->
    <form action="/enquiry" method="post" autocomplete="off">

      <!-- INSTRUCTION 2, 3, 4: Type="text" with name="name" and bound <label for="name"> -->
      <div class="form-group">
        <label for="name">Your Name <span class="required-star">*</span></label>
        <div class="input-wrapper">
          <input 
            type="text" 
            id="name" 
            name="name" 
            placeholder="e.g. John Doe" 
            autocomplete="off"
            required>
        </div>
      </div>

      <!-- INSTRUCTION 2, 3, 4: Type="email" with name="email" and bound <label for="email"> -->
      <div class="form-group">
        <label for="email">Email Address <span class="required-star">*</span></label>
        <div class="input-wrapper">
          <input 
            type="email" 
            id="email" 
            name="email" 
            placeholder="example@gmail.com" 
            autocomplete="off"
            required>
        </div>
      </div>

      <!-- INSTRUCTION 2, 3, 4: Type="date" with name="deadline" and bound <label for="deadline"> -->
      <div class="form-group">
        <label for="deadline">Project Deadline <span class="required-star">*</span></label>
        <div class="input-wrapper">
          <input 
            type="date" 
            id="deadline" 
            name="deadline" 
            required>
        </div>
      </div>

      <!-- INSTRUCTION 5 & 6: <fieldset> with <legend>, same name="budget", different value attributes -->
      <fieldset>
        <legend>Budget range <span class="required-star">*</span></legend>

        <div class="radio-grid">
          <div class="radio-card">
            <input 
              type="radio" 
              id="budget-tier-1" 
              name="budget" 
              value="250_1000" 
              required>
            <label for="budget-tier-1">Starter ($250 – $1,000)</label>
          </div>

          <div class="radio-card">
            <input 
              type="radio" 
              id="budget-tier-2" 
              name="budget" 
              value="1000_5000">
            <label for="budget-tier-2">Professional ($1,000 – $5,000)</label>
          </div>

          <div class="radio-card">
            <input 
              type="radio" 
              id="budget-tier-3" 
              name="budget" 
              value="above_5000">
            <label for="budget-tier-3">Enterprise ($5,000+)</label>
          </div>
        </div>
      </fieldset>

      <!-- INSTRUCTION 7: Submit button using <button type="submit"> -->
      <button type="submit">
        Send enquiry
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>

      <p class="form-footer">Protected by 256-bit SSL encryption. We respect your privacy.</p>

    </form>
  </div>

</body>
</html>
